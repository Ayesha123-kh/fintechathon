<text x="740.0" y="301.05" text-anchor="middle" font-size="13" font-weight="700" fill="#0D0D0D">OpenMausBot agent runtime</text>
<text x="740.0" y="317.05" text-anchor="middle" font-size="11" font-weight="400" fill="#0D0D0D">+ gateway</text>
<text x="740.0" y="333.05" text-anchor="middle" font-size="11" font-weight="400" fill="#0D0D0D">per-user private rooms</text>
<rect x="20" y="385" width="280" height="80" rx="10" fill="#EAFFD0" stroke="#224F10" stroke-width="1.5"/>
<text x="160.0" y="413.55" text-anchor="middle" font-size="13" font-weight="700" fill="#0D0D0D">Worker (scheduler, Asia/Karachi)</text>
<text x="160.0" y="429.55" text-anchor="middle" font-size="11" font-weight="400" fill="#0D0D0D">19 jobs: Gmail sync, nudges,</text>
<text x="160.0" y="445.55" text-anchor="middle" font-size="11" font-weight="400" fill="#0D0D0D">screening, weekly review</text>
<line x1="160" y1="385" x2="160" y2="360" stroke="#224F10" stroke-width="1.8" marker-end="url(#a)"/>
<rect x="320" y="385" width="260" height="80" rx="10" fill="#ffffff" stroke="#224F10" stroke-width="1.5"/>
<text x="450.0" y="413.55" text-anchor="middle" font-size="13" font-weight="700" fill="#0D0D0D">Self-hosted models (vLLM)</text>
<text x="450.0" y="429.55" text-anchor="middle" font-size="11" font-weight="400" fill="#0D0D0D">Qwen3.5-9B thinking · STT · decision model</text>
<text x="450.0" y="445.55" text-anchor="middle" font-size="11" font-weight="400" fill="#0D0D0D">private data stays here</text>
<rect x="600" y="385" width="280" height="80" rx="10" fill="#ffffff" stroke="#224F10" stroke-width="1.5" stroke-dasharray="6 4"/>
<text x="740.0" y="413.55" text-anchor="middle" font-size="13" font-weight="700" fill="#0D0D0D">Optional third-party LLM</text>
<text x="740.0" y="429.55" text-anchor="middle" font-size="11" font-weight="400" fill="#0D0D0D">shared desks only · public data only</text>
<text x="740.0" y="445.55" text-anchor="middle" font-size="11" font-weight="400" fill="#0D0D0D">fail-closed merchant screen in front</text>
<line x1="740" y1="360" x2="740" y2="385" stroke="#224F10" stroke-width="1.8" marker-end="url(#a)"/>
<line x1="450" y1="385" x2="450" y2="360" stroke="#224F10" stroke-width="1.8" marker-end="url(#a)" stroke-dasharray="5 4"/>
<rect x="20" y="490" width="860" height="52" rx="10" fill="#EAFFD0" stroke="#224F10" stroke-width="1.5"/>
<text x="450.0" y="520.2" text-anchor="middle" font-size="12" font-weight="400" fill="#0D0D0D">Agents: per-user team (Finance Assistant · Savings Coach · Deals Advisor · Investment Advisor opt-in)   |   29 shared desk bots (watchers · researchers · analysts · deal crawlers)</text></svg>