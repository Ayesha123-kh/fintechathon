<text x="282.0" y="191.55" text-anchor="middle" font-size="11" font-weight="400" fill="#0D0D0D">tools for ONE user&#x27;s bots</text>
<rect x="372" y="140" width="160" height="78" rx="10" fill="#EAFFD0" stroke="#224F10" stroke-width="1.5"/>
<text x="452.0" y="175.55" text-anchor="middle" font-size="13" font-weight="700" fill="#0D0D0D">MCP: fin_market</text>
<text x="452.0" y="191.55" text-anchor="middle" font-size="11" font-weight="400" fill="#0D0D0D">public market + deal data</text>
