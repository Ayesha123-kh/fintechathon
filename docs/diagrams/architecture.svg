<text x="450.0" y="317.05" text-anchor="middle" font-size="11" font-weight="400" fill="#0D0D0D">sessions · idle lock</text>
<text x="450.0" y="333.05" text-anchor="middle" font-size="11" font-weight="400" fill="#0D0D0D">rate limits · cache</text>
