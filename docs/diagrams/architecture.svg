<text x="160.0" y="317.05" text-anchor="middle" font-size="11" font-weight="400" fill="#0D0D0D">Row-Level Security on every user table</text>
<text x="160.0" y="333.05" text-anchor="middle" font-size="11" font-weight="400" fill="#0D0D0D">FORCE RLS binds the table owner too</text>
<rect x="320" y="265" width="260" height="95" rx="10" fill="#EAFFD0" stroke="#224F10" stroke-width="1.5"/>
