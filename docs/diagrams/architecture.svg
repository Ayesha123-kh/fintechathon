<text x="455.0" y="85.0" text-anchor="middle" font-size="11" font-weight="400" fill="#0D0D0D">HTTPS · cookie + JWT · SSE · Web Push</text>
<rect x="20" y="110" width="860" height="120" rx="10" fill="#ffffff" stroke="#224F10" stroke-width="1.5" stroke-dasharray="6 4"/>
<text x="450.0" y="174.55" text-anchor="middle" font-size="13" font-weight="700" fill="#0D0D0D"></text>
<text x="32" y="128" text-anchor="start" font-size="12" font-weight="700" fill="#224F10">BACKEND (FastAPI)</text>
<rect x="32" y="140" width="160" height="78" rx="10" fill="#EAFFD0" stroke="#224F10" stroke-width="1.5"/>
