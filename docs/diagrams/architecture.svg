<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" width="900" height="560" font-family="Helvetica,Arial,sans-serif"><title>Paisav system architecture</title>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#224F10"/></marker></defs>
<rect width="900" height="560" fill="#ffffff"/>
<rect x="20" y="15" width="860" height="60" rx="10" fill="#B0E454" stroke="#224F10" stroke-width="1.5"/>
<text x="450.0" y="41.55" text-anchor="middle" font-size="13" font-weight="700" fill="#0D0D0D">Users: phone or desktop PWA (Next.js + Tailwind)</text>
<text x="450.0" y="57.55" text-anchor="middle" font-size="11" font-weight="400" fill="#0D0D0D">chat popup · dashboard · goals · banks · push notifications · passkey unlock</text>
