<text x="622.0" y="175.55" text-anchor="middle" font-size="13" font-weight="700" fill="#0D0D0D">Gmail intake</text>
<text x="622.0" y="191.55" text-anchor="middle" font-size="11" font-weight="400" fill="#0D0D0D">read-only bank alerts</text>
<rect x="712" y="140" width="160" height="78" rx="10" fill="#EAFFD0" stroke="#224F10" stroke-width="1.5"/>
<text x="792.0" y="175.55" text-anchor="middle" font-size="13" font-weight="700" fill="#0D0D0D">Deal detection</text>
<text x="792.0" y="191.55" text-anchor="middle" font-size="11" font-weight="400" fill="#0D0D0D">no LLM, plain code</text>
<line x1="200" y1="230" x2="200" y2="262" stroke="#224F10" stroke-width="1.8" marker-end="url(#a)"/>
<text x="208" y="250" text-anchor="start" font-size="11" font-weight="400" fill="#0D0D0D">SQL (RLS-scoped)</text>
