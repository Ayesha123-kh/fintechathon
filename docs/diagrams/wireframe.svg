<text x="600" y="60" text-anchor="start" font-size="13" font-weight="700" fill="#16423C">Screens in the product</text>
<text x="600" y="90" text-anchor="start" font-size="12" font-weight="400" fill="#211913">• Sign up (OTP) · Sign in · Forgot password</text>
<text x="600" y="118" text-anchor="start" font-size="12" font-weight="400" fill="#211913">• Dashboard: totals, banks, goals, spending</text>
<text x="600" y="146" text-anchor="start" font-size="12" font-weight="400" fill="#211913">• Goal detail · Bank detail · Deals</text>
<text x="600" y="174" text-anchor="start" font-size="12" font-weight="400" fill="#211913">• Email connection (read-only Gmail)</text>
<text x="600" y="202" text-anchor="start" font-size="12" font-weight="400" fill="#211913">• Chat widget with live agent activity</text>
<text x="600" y="230" text-anchor="start" font-size="12" font-weight="400" fill="#211913">• Admin: users, deals, cards, agents, plans</text>
<text x="600" y="258" text-anchor="start" font-size="12" font-weight="400" fill="#211913">• PWA: install, offline page, push</text>
<text x="600" y="286" text-anchor="start" font-size="12" font-weight="400" fill="#211913">• Idle lock + fingerprint / face unlock</text>
<text x="600" y="330" text-anchor="start" font-size="11" font-weight="400" fill="#645949">Illustrative layout; numbers are example data.</text></svg>