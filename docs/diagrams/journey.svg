<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 430" width="900" height="430" font-family="Helvetica,Arial,sans-serif"><title>Paisav user journey loop</title>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#224F10"/></marker></defs>
<rect width="900" height="430" fill="#ffffff"/>
<rect x="20" y="30" width="260" height="110" rx="10" fill="#B0E454" stroke="#224F10" stroke-width="1.5"/>
<text x="150.0" y="72.25" text-anchor="middle" font-size="15" font-weight="700" fill="#0D0D0D">1 Onboard</text>
<text x="150.0" y="90.25" text-anchor="middle" font-size="13" font-weight="400" fill="#0D0D0D">chat only, no forms</text>
<text x="150.0" y="108.25" text-anchor="middle" font-size="13" font-weight="400" fill="#0D0D0D">banks · cards · income · goals</text>
<rect x="315" y="30" width="260" height="110" rx="10" fill="#EAFFD0" stroke="#224F10" stroke-width="1.5"/>
<text x="445.0" y="72.25" text-anchor="middle" font-size="15" font-weight="700" fill="#0D0D0D">2 Connect</text>
<text x="445.0" y="90.25" text-anchor="middle" font-size="13" font-weight="400" fill="#0D0D0D">read-only Gmail</text>
<text x="445.0" y="108.25" text-anchor="middle" font-size="13" font-weight="400" fill="#0D0D0D">bank alerts → transactions</text>
<rect x="610" y="30" width="260" height="110" rx="10" fill="#EAFFD0" stroke="#224F10" stroke-width="1.5"/>
<text x="740.0" y="72.25" text-anchor="middle" font-size="15" font-weight="700" fill="#0D0D0D">3 Understand</text>
<text x="740.0" y="90.25" text-anchor="middle" font-size="13" font-weight="400" fill="#0D0D0D">categorise spending</text>
<text x="740.0" y="108.25" text-anchor="middle" font-size="13" font-weight="400" fill="#0D0D0D">fuel · food · grocery · bills</text>
<rect x="610" y="215" width="260" height="110" rx="10" fill="#EAFFD0" stroke="#224F10" stroke-width="1.5"/>
<text x="740.0" y="257.25" text-anchor="middle" font-size="15" font-weight="700" fill="#0D0D0D">4 Plan</text>
<text x="740.0" y="275.25" text-anchor="middle" font-size="13" font-weight="400" fill="#0D0D0D">split income to goals</text>
<text x="740.0" y="293.25" text-anchor="middle" font-size="13" font-weight="400" fill="#0D0D0D">by deadline, weight or rule</text>
<rect x="315" y="215" width="260" height="110" rx="10" fill="#EAFFD0" stroke="#224F10" stroke-width="1.5"/>
<text x="445.0" y="257.25" text-anchor="middle" font-size="15" font-weight="700" fill="#0D0D0D">5 Act</text>
<text x="445.0" y="275.25" text-anchor="middle" font-size="13" font-weight="400" fill="#0D0D0D">offer card-matched deals</text>
<text x="445.0" y="293.25" text-anchor="middle" font-size="13" font-weight="400" fill="#0D0D0D">at places they already spend</text>
<rect x="20" y="215" width="260" height="110" rx="10" fill="#B0E454" stroke="#224F10" stroke-width="1.5"/>
<text x="150.0" y="257.25" text-anchor="middle" font-size="15" font-weight="700" fill="#0D0D0D">6 Credit</text>
<text x="150.0" y="275.25" text-anchor="middle" font-size="13" font-weight="400" fill="#0D0D0D">deal use auto-detected</text>
<text x="150.0" y="293.25" text-anchor="middle" font-size="13" font-weight="400" fill="#0D0D0D">saving moves to the goal</text>
<line x1="280" y1="85" x2="315" y2="85" stroke="#224F10" stroke-width="1.8" marker-end="url(#a)"/>
<line x1="575" y1="85" x2="610" y2="85" stroke="#224F10" stroke-width="1.8" marker-end="url(#a)"/>
<line x1="750" y1="140" x2="750" y2="215" stroke="#224F10" stroke-width="1.8" marker-end="url(#a)"/>
<line x1="610" y1="270" x2="575" y2="270" stroke="#224F10" stroke-width="1.8" marker-end="url(#a)"/>
<line x1="315" y1="270" x2="280" y2="270" stroke="#224F10" stroke-width="1.8" marker-end="url(#a)"/>
<rect x="20" y="355" width="860" height="60" rx="10" fill="#ffffff" stroke="#224F10" stroke-width="1.5" stroke-dasharray="6 4"/>
<text x="450.0" y="389.2" text-anchor="middle" font-size="12" font-weight="400" fill="#0D0D0D">7 Nudge and adapt: weekly &#x27;you saved Rs. X&#x27;, overspend alert, month-end sweep, sadqah reminder. User says &#x27;I got a raise&#x27; → facts update → advice changes → back to step 3.</text>
<line x1="150" y1="325" x2="150" y2="355" stroke="#224F10" stroke-width="1.8" marker-end="url(#a)" stroke-dasharray="5 4"/></svg>