<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 360" width="900" height="360" font-family="Helvetica,Arial,sans-serif"><title>Deal to saving pipeline</title>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#16423C"/></marker></defs>
<rect width="900" height="360" fill="#F7F0E5"/>
<rect x="10" y="30" width="160" height="100" rx="10" fill="#ECE4D2" stroke="#16423C" stroke-width="1.5"/>
<text x="90.0" y="68.55" text-anchor="middle" font-size="13" font-weight="700" fill="#211913">Crawler team</text>
<text x="90.0" y="84.55" text-anchor="middle" font-size="11" font-weight="400" fill="#211913">collects bank &amp; merchant offers</text>
<text x="90.0" y="100.55" text-anchor="middle" font-size="11" font-weight="400" fill="#211913">(shared DB, no user data)</text>
<rect x="188" y="30" width="160" height="100" rx="10" fill="#ECE4D2" stroke="#16423C" stroke-width="1.5"/>
<text x="268.0" y="68.55" text-anchor="middle" font-size="13" font-weight="700" fill="#211913">Deals Advisor</text>
<text x="268.0" y="84.55" text-anchor="middle" font-size="11" font-weight="400" fill="#211913">matches user&#x27;s cards + places</text>
<text x="268.0" y="100.55" text-anchor="middle" font-size="11" font-weight="400" fill="#211913">calls offer_deal</text>
<line x1="170" y1="80" x2="188" y2="80" stroke="#16423C" stroke-width="1.8" marker-end="url(#a)"/>
<rect x="366" y="30" width="160" height="100" rx="10" fill="#ECE4D2" stroke="#16423C" stroke-width="1.5"/>
<text x="446.0" y="68.55" text-anchor="middle" font-size="13" font-weight="700" fill="#211913">User spends</text>
<text x="446.0" y="84.55" text-anchor="middle" font-size="11" font-weight="400" fill="#211913">bank alert email arrives</text>
<text x="446.0" y="100.55" text-anchor="middle" font-size="11" font-weight="400" fill="#211913">debit at the merchant</text>
<line x1="348" y1="80" x2="366" y2="80" stroke="#16423C" stroke-width="1.8" marker-end="url(#a)"/>
<rect x="544" y="30" width="160" height="100" rx="10" fill="#F2B49B" stroke="#16423C" stroke-width="1.5"/>
<text x="624.0" y="68.55" text-anchor="middle" font-size="13" font-weight="700" fill="#211913">detect_redemption</text>
<text x="624.0" y="84.55" text-anchor="middle" font-size="11" font-weight="400" fill="#211913">plain code, no LLM</text>
<text x="624.0" y="100.55" text-anchor="middle" font-size="11" font-weight="400" fill="#211913">6 checks (below)</text>
<line x1="526" y1="80" x2="544" y2="80" stroke="#16423C" stroke-width="1.8" marker-end="url(#a)"/>
<rect x="722" y="30" width="160" height="100" rx="10" fill="#F2B49B" stroke="#16423C" stroke-width="1.5"/>
<text x="802.0" y="68.55" text-anchor="middle" font-size="13" font-weight="700" fill="#211913">Saving credited</text>
<text x="802.0" y="84.55" text-anchor="middle" font-size="11" font-weight="400" fill="#211913">goal progress moves</text>
<text x="802.0" y="100.55" text-anchor="middle" font-size="11" font-weight="400" fill="#211913">push: &#x27;You just saved Rs. X&#x27;</text>
<line x1="704" y1="80" x2="722" y2="80" stroke="#16423C" stroke-width="1.8" marker-end="url(#a)"/>
<rect x="10" y="170" width="880" height="170" rx="10" fill="#F7F0E5" stroke="#16423C" stroke-width="1.5" stroke-dasharray="6 4"/>
<text x="450.0" y="259.55" text-anchor="middle" font-size="13" font-weight="700" fill="#211913"></text>
<text x="24" y="192" text-anchor="start" font-size="13" font-weight="700" fill="#16423C">What detect_redemption checks before it moves a rupee</text>
<text x="34" y="218" text-anchor="start" font-size="12" font-weight="400" fill="#211913">✓  Merchant on the alert resolves to the deal&#x27;s merchant</text>
<text x="34" y="238" text-anchor="start" font-size="12" font-weight="400" fill="#211913">✓  Transaction is AFTER the offer and within 14 days of it</text>
<text x="34" y="258" text-anchor="start" font-size="12" font-weight="400" fill="#211913">✓  Inside the deal&#x27;s own dates and weekdays (Pakistan time)</text>
<text x="34" y="278" text-anchor="start" font-size="12" font-weight="400" fill="#211913">✓  If a card is required: account is at the deal&#x27;s bank AND user owns a matching card</text>
<text x="34" y="298" text-anchor="start" font-size="12" font-weight="400" fill="#211913">✓  Amount clears the deal&#x27;s minimum spend</text>
<text x="34" y="318" text-anchor="start" font-size="12" font-weight="400" fill="#211913">✓  One redemption per offer, one per transaction (no double counting)</text>
<text x="24" y="334" text-anchor="start" font-size="11" font-weight="400" fill="#645949">The debit is assumed to be after the discount: bill = debit ÷ (1 − discount), saving = bill − debit, capped at the deal&#x27;s maximum. Shown as &#x27;about Rs. X&#x27;. Credit-card deals stay manual.</text></svg>