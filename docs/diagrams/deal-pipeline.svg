<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 360" width="900" height="360" font-family="Helvetica,Arial,sans-serif"><title>Deal to saving pipeline</title>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#224F10"/></marker></defs>
<rect width="900" height="360" fill="#ffffff"/>
<rect x="10" y="30" width="160" height="100" rx="10" fill="#EAFFD0" stroke="#224F10" stroke-width="1.5"/>
<text x="90.0" y="68.55" text-anchor="middle" font-size="13" font-weight="700" fill="#0D0D0D">Crawler team</text>
<text x="90.0" y="84.55" text-anchor="middle" font-size="11" font-weight="400" fill="#0D0D0D">collects bank &amp; merchant offers</text>
<text x="90.0" y="100.55" text-anchor="middle" font-size="11" font-weight="400" fill="#0D0D0D">(shared DB, no user data)</text>
<rect x="188" y="30" width="160" height="100" rx="10" fill="#EAFFD0" stroke="#224F10" stroke-width="1.5"/>
<text x="268.0" y="68.55" text-anchor="middle" font-size="13" font-weight="700" fill="#0D0D0D">Deals Advisor</text>
<text x="268.0" y="84.55" text-anchor="middle" font-size="11" font-weight="400" fill="#0D0D0D">matches user&#x27;s cards + places</text>
<text x="268.0" y="100.55" text-anchor="middle" font-size="11" font-weight="400" fill="#0D0D0D">calls offer_deal</text>
<line x1="170" y1="80" x2="188" y2="80" stroke="#224F10" stroke-width="1.8" marker-end="url(#a)"/>
<rect x="366" y="30" width="160" height="100" rx="10" fill="#EAFFD0" stroke="#224F10" stroke-width="1.5"/>
<text x="446.0" y="68.55" text-anchor="middle" font-size="13" font-weight="700" fill="#0D0D0D">User spends</text>
<text x="446.0" y="84.55" text-anchor="middle" font-size="11" font-weight="400" fill="#0D0D0D">bank alert email arrives</text>
<text x="446.0" y="100.55" text-anchor="middle" font-size="11" font-weight="400" fill="#0D0D0D">debit at the merchant</text>
<line x1="348" y1="80" x2="366" y2="80" stroke="#224F10" stroke-width="1.8" marker-end="url(#a)"/>
<rect x="544" y="30" width="160" height="100" rx="10" fill="#B0E454" stroke="#224F10" stroke-width="1.5"/>
<text x="624.0" y="68.55" text-anchor="middle" font-size="13" font-weight="700" fill="#0D0D0D">detect_redemption</text>
<text x="624.0" y="84.55" text-anchor="middle" font-size="11" font-weight="400" fill="#0D0D0D">plain code, no LLM</text>
<text x="624.0" y="100.55" text-anchor="middle" font-size="11" font-weight="400" fill="#0D0D0D">6 checks (below)</text>
<line x1="526" y1="80" x2="544" y2="80" stroke="#224F10" stroke-width="1.8" marker-end="url(#a)"/>
<rect x="722" y="30" width="160" height="100" rx="10" fill="#B0E454" stroke="#224F10" stroke-width="1.5"/>
<text x="802.0" y="68.55" text-anchor="middle" font-size="13" font-weight="700" fill="#0D0D0D">Saving credited</text>
<text x="802.0" y="84.55" text-anchor="middle" font-size="11" font-weight="400" fill="#0D0D0D">goal progress moves</text>
<text x="802.0" y="100.55" text-anchor="middle" font-size="11" font-weight="400" fill="#0D0D0D">push: &#x27;You just saved Rs. X&#x27;</text>
<line x1="704" y1="80" x2="722" y2="80" stroke="#224F10" stroke-width="1.8" marker-end="url(#a)"/>
<rect x="10" y="170" width="880" height="170" rx="10" fill="#ffffff" stroke="#224F10" stroke-width="1.5" stroke-dasharray="6 4"/>
<text x="450.0" y="259.55" text-anchor="middle" font-size="13" font-weight="700" fill="#0D0D0D"></text>
<text x="24" y="192" text-anchor="start" font-size="13" font-weight="700" fill="#224F10">What detect_redemption checks before it moves a rupee</text>
<text x="34" y="218" text-anchor="start" font-size="12" font-weight="400" fill="#0D0D0D">✓  Merchant on the alert resolves to the deal&#x27;s merchant</text>
<text x="34" y="238" text-anchor="start" font-size="12" font-weight="400" fill="#0D0D0D">✓  Transaction is AFTER the offer and within 14 days of it</text>
<text x="34" y="258" text-anchor="start" font-size="12" font-weight="400" fill="#0D0D0D">✓  Inside the deal&#x27;s own dates and weekdays (Pakistan time)</text>
<text x="34" y="278" text-anchor="start" font-size="12" font-weight="400" fill="#0D0D0D">✓  If a card is required: account is at the deal&#x27;s bank AND user owns a matching card</text>
<text x="34" y="298" text-anchor="start" font-size="12" font-weight="400" fill="#0D0D0D">✓  Amount clears the deal&#x27;s minimum spend</text>
<text x="34" y="318" text-anchor="start" font-size="12" font-weight="400" fill="#0D0D0D">✓  One redemption per offer, one per transaction (no double counting)</text>
<text x="24" y="334" text-anchor="start" font-size="11" font-weight="400" fill="#444">The debit is assumed to be after the discount: bill = debit ÷ (1 − discount), saving = bill − debit, capped at the deal&#x27;s maximum. Shown as &#x27;about Rs. X&#x27;. Credit-card deals stay manual.</text></svg>