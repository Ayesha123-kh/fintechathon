# Development stack:  cp .env.example .env  (fill in the secrets), then
#   docker compose up --build
# Web app: http://localhost:3000   API docs: http://localhost:8000/api/docs
#
# Every setting lives in the one root .env; nothing is defaulted here. backend/.env is a symlink to it, which the
# API and the scheduler read whole. The agents container (omb) runs bots and a browser, so ai-ml/.env is a small
# file that lists only the variables omb needs, each pulled from the root .env (no JWT / encryption / SMTP / OAuth /
# database-owner secrets reach it).
#
# Models (Qwen3.5-9B, STT, decision model) run separately on vLLM; by default they are
# expected on the host machine (host.docker.internal). Point the *_BASE_URL vars elsewhere if remote.

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports: ["127.0.0.1:5433:5432"]
    volumes: [pg_data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20

  dragonfly:
    image: docker.dragonflydb.io/dragonflydb/dragonfly:v1.34.2
    restart: unless-stopped
    ulimits:
      memlock: -1
    command: ["--maxmemory=512mb", "--proactor_threads=2"]
    ports: ["127.0.0.1:6380:6379"]
    volumes: [dragonfly_data:/data]
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 20

  backend:
    build: ./backend
    restart: unless-stopped
    env_file: ./backend/.env # a symlink to the root .env
    command: ["api"]
    ports: ["127.0.0.1:8000:8000"]
    extra_hosts: ["host.docker.internal:host-gateway"]
    depends_on:
      postgres: { condition: service_healthy }
      dragonfly: { condition: service_healthy }
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request;urllib.request.urlopen('http://127.0.0.1:8000/api/health')\""]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 20s

  worker:
    build: ./backend
    restart: unless-stopped
    env_file: ./backend/.env # a symlink to the root .env
    command: ["worker"]
    extra_hosts: ["host.docker.internal:host-gateway"]
    depends_on:
      backend: { condition: service_healthy }

  # OpenMausBot + agents gateway (one container; OMB only listens on loopback inside it).
  omb:
    build: ./ai-ml
    restart: unless-stopped
    init: false # the image runs tini itself
    stop_grace_period: 30s
    shm_size: 512m
    env_file: ./ai-ml/.env # only what omb needs, taken from the root .env
    expose: ["8790"]
    ports: ["127.0.0.1:8790:8790"]
    extra_hosts: ["host.docker.internal:host-gateway"]
    volumes: [omb_data:/data]
    depends_on:
      backend: { condition: service_healthy }

  frontend:
    build:
      context: ./frontend
      args:
        BACKEND_INTERNAL_URL: ${BACKEND_INTERNAL_URL}
    restart: unless-stopped
    ports: ["3000:3000"]
    depends_on: [backend]

volumes:
  pg_data:
  dragonfly_data:
  omb_data:
